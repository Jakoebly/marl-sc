search_space:
  # --- Shared (algorithm-agnostic) hyperparameters ---
  shared:
    learning_rate:
      type: loguniform
      low: 2.449e-4
      high: 2.204e-3

  # --- Algorithm-specific hyperparameters ---
  algorithm_specific:
    entropy_coeff:
      type: loguniform
      low: 4.115e-4
      high: 3.704e-3
    vf_loss_coeff:
      type: loguniform
      low: 0.329774
      high: 2.967963

scheduler:
  type: fifo

search_algorithm:
  type: optuna

