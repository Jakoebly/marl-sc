search_space:
  # --- Shared (algorithm-agnostic) hyperparameters ---
  shared:
    learning_rate:
      type: loguniform
      low: 5.946e-5
      high: 5.351e-4

  # --- Algorithm-specific hyperparameters ---
  algorithm_specific:
    entropy_coeff:
      type: loguniform
      low: 0.015560
      high: 0.140044
    vf_loss_coeff:
      type: uniform
      low: 0.093035
      high: 0.837319

scheduler:
  type: fifo

search_algorithm:
  type: optuna
