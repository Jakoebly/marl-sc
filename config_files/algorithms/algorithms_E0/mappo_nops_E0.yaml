algorithm:
  name: "mappo"
  shared:
    num_iterations: 300
    checkpoint_freq: 100
    batch_size: 4000
    num_epochs: 5
    num_minibatches: 20
    learning_rate: 0.0012232207782950947
    num_env_runners: 2
    num_envs_per_env_runner: 10
    num_cpus_per_env_runner: 1
    eval_interval: 5
    num_eval_episodes: 5
    evaluation_parallel_to_training: false

  algorithm_specific:
    use_gae: true
    lam: 0.99
    gamma: 0.99
    use_kl_loss: true
    grad_clip: 5.0
    entropy_coeff: 0.009710803695047477
    vf_loss_coeff: 0.3393084444175186
    clip_param: 0.3
    vf_clip_param: 2176.35263012551
    logstd_init: -1.4305191741570926
    logstd_floor: -3.854460917790878
    obs_normalization: "meanstd_custom"
    parameter_sharing: false
    actor_obs_type: "local"
    critic_obs_type: "global"
    networks:
      shared_layers: null
      use_mu_sigma_head: false
      actor:
        type: "mlp"
        config:        
          hidden_sizes: [512, 512]
          activation: "relu"
          output_activation: null
      critic:
        type: "mlp"
        config:
          hidden_sizes: [64, 64]
          activation: "relu"
          output_activation: null

