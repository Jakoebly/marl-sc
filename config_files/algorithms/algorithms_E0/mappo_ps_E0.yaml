algorithm:
  name: "mappo"
  shared:
    num_iterations: 300
    checkpoint_freq: 100
    batch_size: 16000
    num_epochs: 20
    num_minibatches: 1
    learning_rate: 0.000203180685194347
    num_env_runners: 2
    num_envs_per_env_runner: 10
    num_cpus_per_env_runner: 1
    eval_interval: 5
    num_eval_episodes: 5  
    evaluation_parallel_to_training: false

  algorithm_specific:
    use_gae: true
    lam: 0.9
    gamma: 0.99
    use_kl_loss: true
    grad_clip: 100000.0
    entropy_coeff: 0.0016110713512164025
    vf_loss_coeff: 0.7026889173010082
    clip_param: 0.1
    vf_clip_param: 106.22871714693355
    logstd_init: -1.296026969524603
    logstd_floor: -2.350614103322646
    obs_normalization: "meanstd_custom"
    parameter_sharing: true
    actor_obs_type: "local"
    critic_obs_type: "global"
    networks:
      shared_layers: null
      use_mu_sigma_head: false
      actor:
        type: "mlp"
        config:        
          hidden_sizes: [128, 256]
          activation: "relu"
          output_activation: null
      critic:
        type: "mlp"
        config:
          hidden_sizes: [512, 512]
          activation: "relu"
          output_activation: null

