algorithm:
  name: "ippo"
  shared:
    num_iterations: 300
    checkpoint_freq: 100
    batch_size: 16000
    num_epochs: 5
    num_minibatches: 10
    learning_rate: 0.0003158866555076806
    num_env_runners: 2
    num_envs_per_env_runner: 10
    num_cpus_per_env_runner: 1
    eval_interval: 5
    num_eval_episodes: 5
    evaluation_parallel_to_training: false

  algorithm_specific:
    use_gae: true
    lam: 0.97
    gamma: 0.99
    use_kl_loss: false
    grad_clip: 20.0
    entropy_coeff: 0.003812900141469338
    vf_loss_coeff: 0.6157606439406658
    clip_param: 0.1
    vf_clip_param: 68.25037024108683
    logstd_init: -1.4148517416536208
    logstd_floor: -3.535480170861897
    obs_normalization: "meanstd_custom"
    parameter_sharing: false
    actor_obs_type: "local"
    critic_obs_type: "local"
    networks:
      shared_layers: null
      use_mu_sigma_head: false
      actor:
        type: "mlp"
        config:        
          hidden_sizes: [128, 256]
          activation: "relu"
          output_activation: null
      critic:
        type: "mlp"
        config:
          hidden_sizes: [128, 128]
          activation: "relu"
          output_activation: null



