algorithm:
  name: ippo
  shared:
    num_iterations: 300
    checkpoint_freq: 100
    batch_size: 16000
    num_epochs: 20
    num_minibatches: 4
    learning_rate: 8.206306712674987e-05
    num_env_runners: 2
    num_envs_per_env_runner: 10
    num_cpus_per_env_runner: 1
    eval_interval: 5
    num_eval_episodes: 5
    evaluation_parallel_to_training: false

algorithm_specific:
    use_gae: true
    lam: 0.95
    gamma: 0.99
    use_kl_loss: false
    grad_clip: 100000.0
    entropy_coeff: 0.0010370166437266473
    vf_loss_coeff: 1.0514844928553273
    clip_param: 0.1
    vf_clip_param: 119.67661411187376
    logstd_init: -1.4243793298204024
    logstd_floor: -3.2818278724462973
    obs_normalization: meanstd_custom
    parameter_sharing: true
    actor_obs_type: "local"
    critic_obs_type: "global"
    networks:
      shared_layers: null
      use_mu_sigma_head: false
      actor:
        type: "mlp"
        config:        
          hidden_sizes: [128, 128]
          activation: "relu"
          output_activation: null
      critic:
        type: "mlp"
        config:
          hidden_sizes: [64, 64]
          activation: "relu"
          output_activation: null

