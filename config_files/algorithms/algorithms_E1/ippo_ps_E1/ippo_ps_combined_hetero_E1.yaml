algorithm:
  name: ippo
  shared:
    num_iterations: 300
    checkpoint_freq: 100
    batch_size: 16000
    num_epochs: 10
    num_minibatches: 4
    learning_rate: 7.864838472626283e-05
    num_env_runners: 2
    num_envs_per_env_runner: 10
    num_cpus_per_env_runner: 1
    eval_interval: 5
    num_eval_episodes: 5
    evaluation_parallel_to_training: false

algorithm_specific:
    use_gae: true
    lam: 0.95
    gamma: 0.95
    use_kl_loss: true
    grad_clip: 20.0
    entropy_coeff: 0.0038985059740007074
    vf_loss_coeff: 0.700363247253834
    clip_param: 0.3
    vf_clip_param: 52.51540539107055
    logstd_init: -0.6548400348592918
    logstd_floor: -3.924362510397332
    obs_normalization: meanstd_custom
    parameter_sharing: true
    actor_obs_type: "local"
    critic_obs_type: "global"
    networks:
      shared_layers: null
      use_mu_sigma_head: false
      actor:
        type: "mlp"
        config:        
          hidden_sizes: [256]
          activation: "relu"
          output_activation: null
      critic:
        type: "mlp"
        config:
          hidden_sizes: [128, 128]
          activation: "relu"
          output_activation: null

