algorithm:
  name: "cppo"
  shared:
    num_iterations: 300
    checkpoint_freq: 100
    batch_size: 16000
    num_epochs: 3
    num_minibatches: 20
    learning_rate: 0.00010704835586443312
    num_env_runners: 2
    num_envs_per_env_runner: 10
    num_cpus_per_env_runner: 1
    eval_interval: 5
    num_eval_episodes: 5
    evaluation_parallel_to_training: false

  algorithm_specific:
    use_gae: true
    lam: 0.9
    gamma: 0.95
    use_kl_loss: false
    grad_clip: 100000.0
    entropy_coeff: 0.0010525323456168248
    vf_loss_coeff: 0.9367716399077813
    clip_param: 0.3
    vf_clip_param: 186.08157082017777
    logstd_init: -1.223895194257456
    logstd_floor: -3.650917345474163
    obs_normalization: "meanstd_custom"
    networks:
      shared_layers: null
      use_mu_sigma_head: false
      actor:
        type: "mlp"
        config:
          hidden_sizes: [512]
          activation: "relu"
          output_activation: null
      critic:
        type: "mlp"
        config:
          hidden_sizes: [128, 129]
          activation: "relu"
          output_activation: null
