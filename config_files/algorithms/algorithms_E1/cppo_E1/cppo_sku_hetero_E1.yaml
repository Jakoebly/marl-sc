algorithm:
  name: "cppo"
  shared:
    num_iterations: 300
    checkpoint_freq: 100
    batch_size: 16000
    num_epochs: 10
    num_minibatches: 20
    learning_rate: 0.000064107526430472
    num_env_runners: 2
    num_envs_per_env_runner: 10
    num_cpus_per_env_runner: 1
    eval_interval: 5
    num_eval_episodes: 5
    evaluation_parallel_to_training: false

  algorithm_specific:
    use_gae: true
    lam: 0.9
    gamma: 0.95
    use_kl_loss: true
    grad_clip: 100000.0
    entropy_coeff: 0.0011742938652031017
    vf_loss_coeff: 1.1716461124223418
    clip_param: 0.2
    vf_clip_param: 6490.731060098136
    logstd_init: -0.3502435696476987
    logstd_floor: -2.06132145366084
    obs_normalization: "meanstd_custom"
    networks:
      shared_layers: null
      use_mu_sigma_head: false
      actor:
        type: "mlp"
        config:
          hidden_sizes: [512]
          activation: "relu"
          output_activation: null
      critic:
        type: "mlp"
        config:
          hidden_sizes: [256, 256]
          activation: "relu"
          output_activation: null
