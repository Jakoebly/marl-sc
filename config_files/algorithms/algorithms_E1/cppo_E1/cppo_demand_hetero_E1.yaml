algorithm:
  name: "cppo"
  shared:
    num_iterations: 300
    checkpoint_freq: 100
    batch_size: 16000
    num_epochs: 15
    num_minibatches: 1
    learning_rate: 0.0000657642822563233
    num_env_runners: 2
    num_envs_per_env_runner: 10
    num_cpus_per_env_runner: 1
    eval_interval: 5
    num_eval_episodes: 5
    evaluation_parallel_to_training: false

  algorithm_specific:
    use_gae: true
    lam: 0.9
    gamma: 0.95
    use_kl_loss: false
    grad_clip: 100000.0
    entropy_coeff: 0.001035063229994942
    vf_loss_coeff: 0.565030883557587
    clip_param: 0.2
    vf_clip_param: 15.722217254043736
    logstd_init: -1.4115914586796192
    logstd_floor: -3.13359008160195
    obs_normalization: "meanstd_custom"
    networks:
      shared_layers: null
      use_mu_sigma_head: false
      actor:
        type: "mlp"
        config:
          hidden_sizes: [512, 512]
          activation: "relu"
          output_activation: null
      critic:
        type: "mlp"
        config:
          hidden_sizes: [256]
          activation: "relu"
          output_activation: null
