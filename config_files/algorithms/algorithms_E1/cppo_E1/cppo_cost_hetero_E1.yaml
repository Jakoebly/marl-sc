algorithm:
  name: "cppo"
  shared:
    num_iterations: 300
    checkpoint_freq: 100
    batch_size: 16000
    num_epochs: 5
    num_minibatches: 1
    learning_rate: 0.00019004781614567566
    num_env_runners: 2
    num_envs_per_env_runner: 10
    num_cpus_per_env_runner: 1
    eval_interval: 5
    num_eval_episodes: 5
    evaluation_parallel_to_training: false

  algorithm_specific:
    use_gae: true
    lam: 0.95
    gamma: 0.95
    use_kl_loss: true
    grad_clip: 5.0
    entropy_coeff: 0.0012367494512296265
    vf_loss_coeff: 0.6243776619427822
    clip_param: 0.2
    vf_clip_param: 15.788422747121675
    logstd_init: -1.3545247426105522
    logstd_floor: -2.7221584490519892
    obs_normalization: "meanstd_custom"
    networks:
      shared_layers: null
      use_mu_sigma_head: false
      actor:
        type: "mlp"
        config:
          hidden_sizes: [256, 128]
          activation: "relu"
          output_activation: null
      critic:
        type: "mlp"
        config:
          hidden_sizes: [256]
          activation: "relu"
          output_activation: null
