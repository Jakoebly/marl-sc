algorithm:
  name: "mappo"
  shared:
    num_iterations: 300
    checkpoint_freq: 50
    batch_size: 16000
    num_epochs: 5
    num_minibatches: 4
    learning_rate: 5.7027857075948714e-05
    num_env_runners: 2
    num_envs_per_env_runner: 10
    num_cpus_per_env_runner: 1
    eval_interval: 5
    num_eval_episodes: 5  
    evaluation_parallel_to_training: false

  algorithm_specific:
    use_gae: true
    lam: 0.95
    gamma: 0.95
    use_kl_loss: true
    grad_clip: 20.0
    entropy_coeff: 0.014869662104354293
    vf_loss_coeff: 0.7081346347565504
    clip_param: 0.3
    vf_clip_param: 289.2677972532099
    logstd_init: -0.9431636064304365
    logstd_floor: -3.5738519738364363
    obs_normalization: "meanstd_wh_grouped"
    reward_decomposition: true
    parameter_sharing: true
    actor_obs_type: "local"
    critic_obs_type: "global"
    networks:
      shared_layers: null
      use_mu_sigma_head: false
      actor:
        type: "attention"
        config:
          d_model: 64
          n_heads: 2
          n_layers: 1
          ff_hidden: 64
          head_hidden_sizes: [128]
          activation: "relu"
          dropout: 0.0
          output_activation: null
      critic:
        type: "attention"
        config:
          d_model: 64
          n_heads: 2
          n_layers: 1
          ff_hidden: 64
          head_hidden_sizes: [64]
          activation: "relu"
          dropout: 0.0
          output_activation: null

