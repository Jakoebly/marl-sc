algorithm:
  name: "mappo"
  shared:
    num_iterations: 300
    checkpoint_freq: 100
    batch_size: 16000
    num_epochs: 10
    num_minibatches: 1
    learning_rate: 0.0001783759709997522
    num_env_runners: 2
    num_envs_per_env_runner: 10
    num_cpus_per_env_runner: 1
    eval_interval: 5
    num_eval_episodes: 5  
    evaluation_parallel_to_training: false
    
  algorithm_specific:
    use_gae: true
    lam: 0.9
    gamma: 0.95
    use_kl_loss: true
    grad_clip: 5.0
    entropy_coeff: 0.04668147043967808
    vf_loss_coeff: 0.27910623010927016
    clip_param: 0.3
    vf_clip_param: 517.1395459020547
    logstd_init: -1.3959884335444284
    logstd_floor: -3.0921846733064178
    obs_normalization: "meanstd_custom"
    parameter_sharing: true
    actor_obs_type: "local"
    critic_obs_type: "global"
    networks:
      shared_layers: null
      use_mu_sigma_head: false
      actor:
        type: "mlp"
        config:        
          hidden_sizes: [304, 156]
          activation: "relu"
          output_activation: null
      critic:
        type: "mlp"
        config:
          hidden_sizes: [176, 356]
          activation: "relu"
          output_activation: null