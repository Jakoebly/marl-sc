algorithm:
  name: "mappo"
  shared:
    num_iterations: 300
    checkpoint_freq: 100
    batch_size: 4000
    num_epochs: 20
    num_minibatches: 10
    learning_rate: 0.0012083550319864265
    num_env_runners: 2
    num_envs_per_env_runner: 10
    num_cpus_per_env_runner: 1
    eval_interval: 5
    num_eval_episodes: 5  
    evaluation_parallel_to_training: false

  algorithm_specific:
    use_gae: true
    lam: 0.99
    gamma: 0.995
    use_kl_loss: true
    grad_clip: 10.0
    entropy_coeff: 0.00041746687439344634
    vf_loss_coeff: 1.737662451777033
    clip_param: 0.3
    vf_clip_param: 156.40087830594456
    logstd_init: -1.3093671623165593
    logstd_floor: -3.588733674087321
    obs_normalization: "meanstd_custom"
    parameter_sharing: true
    actor_obs_type: "local"
    critic_obs_type: "global"
    networks:
      shared_layers: null
      use_mu_sigma_head: false
      actor:
        type: "mlp"
        config:        
          hidden_sizes: [240, 228]
          activation: "relu"
          output_activation: null
      critic:
        type: "mlp"
        config:
          hidden_sizes: [550]
          activation: "relu"
          output_activation: null
