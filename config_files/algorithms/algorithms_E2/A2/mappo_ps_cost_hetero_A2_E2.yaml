algorithm:
  name: "mappo"
  shared:
    num_iterations: 300
    checkpoint_freq: 100
    batch_size: 8000
    num_epochs: 3
    num_minibatches: 4
    learning_rate: 0.000993315467993317
    num_env_runners: 2
    num_envs_per_env_runner: 10
    num_cpus_per_env_runner: 1
    eval_interval: 5
    num_eval_episodes: 5  
    evaluation_parallel_to_training: false

  algorithm_specific:
    use_gae: true
    lam: 0.9
    gamma: 0.99
    use_kl_loss: true
    grad_clip: 5.0
    entropy_coeff: 0.0033162693101711667
    vf_loss_coeff: 0.4010950386487496
    clip_param: 0.2
    vf_clip_param: 68.58108106434432
    logstd_init: -1.3284221556071907
    logstd_floor: -3.3308765835769893
    obs_normalization: "meanstd_custom"
    parameter_sharing: true
    actor_obs_type: "local"
    critic_obs_type: "global"
    networks:
      shared_layers: null
      use_mu_sigma_head: false
      actor:
        type: "mlp"
        config:        
          hidden_sizes: [512, 512]
          activation: "relu"
          output_activation: null
      critic:
        type: "mlp"
        config:
          hidden_sizes: [256]
          activation: "relu"
          output_activation: null

