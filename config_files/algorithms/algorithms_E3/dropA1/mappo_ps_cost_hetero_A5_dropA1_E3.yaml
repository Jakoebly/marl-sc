# E3.1 A5 drop-one ablation: A5 minus A1 (obs_normalization reverted meanstd_wh_grouped -> meanstd_custom).
# Derived from the locked E2.6 A5 config (algorithms_E2/A5/mappo_ps_cost_hetero_A5_E2.yaml); HPs inherited, no re-tune.
algorithm:
  name: "mappo"
  shared:
    num_iterations: 300
    checkpoint_freq: 100
    batch_size: 8000
    num_epochs: 3
    num_minibatches: 4
    learning_rate: 0.0009470212482231498
    num_env_runners: 2
    num_envs_per_env_runner: 10
    num_cpus_per_env_runner: 1
    eval_interval: 5
    num_eval_episodes: 5
    evaluation_parallel_to_training: false

  algorithm_specific:
    use_gae: true
    lam: 0.9
    gamma: 0.99
    use_kl_loss: true
    grad_clip: 5.0
    entropy_coeff: 0.0011564382831073317
    vf_loss_coeff: 7.724485059183612e-05
    clip_param: 0.2
    vf_clip_param: 68.58108106434432
    logstd_init: -1.3284221556071907
    logstd_floor: -3.3308765835769893
    obs_normalization: "meanstd_custom"
    reward_decomposition: true
    parameter_sharing: true
    actor_obs_type: "local"
    critic_obs_type: "global"
    networks:
      shared_layers: null
      use_mu_sigma_head: false
      actor:
        type: "attention"
        config:
          d_model: 64
          n_heads: 2
          n_layers: 1
          ff_hidden: 64
          head_hidden_sizes: [128]
          activation: "relu"
          dropout: 0.0
          output_activation: null
      critic:
        type: "attention"
        config:
          d_model: 64
          n_heads: 2
          n_layers: 1
          ff_hidden: 64
          head_hidden_sizes: [64]
          activation: "relu"
          dropout: 0.0
          output_activation: null
