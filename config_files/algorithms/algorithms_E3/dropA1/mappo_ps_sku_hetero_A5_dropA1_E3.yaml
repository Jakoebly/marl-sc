algorithm:
  name: "mappo"
  shared:
    num_iterations: 300
    checkpoint_freq: 100
    batch_size: 16000
    num_epochs: 10
    num_minibatches: 1
    learning_rate: 0.00011781905346477516
    num_env_runners: 2
    num_envs_per_env_runner: 10
    num_cpus_per_env_runner: 1
    eval_interval: 5
    num_eval_episodes: 5  
    evaluation_parallel_to_training: false
    
  algorithm_specific:
    use_gae: true
    lam: 0.9
    gamma: 0.95
    use_kl_loss: true
    grad_clip: 5.0
    entropy_coeff: 0.08094365333405858
    vf_loss_coeff: 0.29667185289889303
    clip_param: 0.3
    vf_clip_param: 517.1395459020547
    logstd_init: -1.3959884335444284
    logstd_floor: -3.0921846733064178
    obs_normalization: "meanstd_custom"
    reward_decomposition: true
    parameter_sharing: true
    actor_obs_type: "local"
    critic_obs_type: "global"
    networks:
      shared_layers: null
      use_mu_sigma_head: false
      actor:
        type: "attention"
        config:
          d_model: 64
          n_heads: 2
          n_layers: 1
          ff_hidden: 64
          head_hidden_sizes: [128]
          activation: "relu"
          dropout: 0.0
          output_activation: null
      critic:
        type: "attention"
        config:
          d_model: 64
          n_heads: 2
          n_layers: 1
          ff_hidden: 64
          head_hidden_sizes: [64]
          activation: "relu"
          dropout: 0.0
          output_activation: null
