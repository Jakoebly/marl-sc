# E3.1 A5 drop-one ablation: A5 minus A3 (reward_decomposition true -> false).
# Derived from the locked E2.6 A5 config (algorithms_E2/A5/mappo_ps_demand_hetero_A5_E2.yaml); HPs inherited, no re-tune.
algorithm:
  name: "mappo"
  shared:
    num_iterations: 300
    checkpoint_freq: 100
    batch_size: 4000
    num_epochs: 20
    num_minibatches: 10
    learning_rate: 0.0006443682613793064
    num_env_runners: 2
    num_envs_per_env_runner: 10
    num_cpus_per_env_runner: 1
    eval_interval: 5
    num_eval_episodes: 5
    evaluation_parallel_to_training: false

  algorithm_specific:
    use_gae: true
    lam: 0.99
    gamma: 0.995
    use_kl_loss: true
    grad_clip: 10.0
    entropy_coeff: 0.0014460426525981919
    vf_loss_coeff: 0.011361674488548338
    clip_param: 0.3
    vf_clip_param: 156.40087830594456
    logstd_init: -1.3093671623165593
    logstd_floor: -3.588733674087321
    obs_normalization: "meanstd_wh_grouped"
    reward_decomposition: false
    parameter_sharing: true
    actor_obs_type: "local"
    critic_obs_type: "global"
    networks:
      shared_layers: null
      use_mu_sigma_head: false
      actor:
        type: "attention"
        config:
          d_model: 64
          n_heads: 2
          n_layers: 1
          ff_hidden: 64
          head_hidden_sizes: [128]
          activation: "relu"
          dropout: 0.0
          output_activation: null
      critic:
        type: "attention"
        config:
          d_model: 64
          n_heads: 2
          n_layers: 1
          ff_hidden: 64
          head_hidden_sizes: [64]
          activation: "relu"
          dropout: 0.0
          output_activation: null
