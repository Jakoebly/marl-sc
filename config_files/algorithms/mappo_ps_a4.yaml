algorithm:
  name: "mappo"
  shared:
    num_iterations: 300
    checkpoint_freq: 100
    batch_size: 8000
    num_epochs: 20
    num_minibatches: 10
    learning_rate: 0.0007598648793612028
    num_env_runners: 2
    num_envs_per_env_runner: 10
    num_cpus_per_env_runner: 1
    eval_interval: 5
    num_eval_episodes: 5
    evaluation_parallel_to_training: false

  algorithm_specific:
    use_gae: true
    lam: 0.95
    gamma: 0.99
    use_kl_loss: true
    grad_clip: 5.0
    entropy_coeff: 0.005422636942319648
    vf_loss_coeff: 0.836257527392694
    clip_param: 0.2
    vf_clip_param: 2046.8403482088547
    logstd_init: -1.4184384587167504
    logstd_floor: -3.51636237623627
    obs_normalization: "meanstd_custom"
    parameter_sharing: true
    actor_obs_type: "local"
    critic_obs_type: "global"
    networks:
      # A4 — Per-SKU self-attention (per-warehouse attention; shared weights).
      # The token-input width and token count are derived at runtime from the
      # observation layout. d_model / ff_hidden size the attention stage;
      # head_hidden_sizes is the post-attention MLP head (analogous to MLP
      # hidden_sizes). shared_layers must be null and use_mu_sigma_head false.
      shared_layers: null
      use_mu_sigma_head: false
      actor:
        type: "attention"
        config:
          d_model: 32
          n_heads: 4
          n_layers: 1
          ff_hidden: 64
          head_hidden_sizes: [128]
          activation: "relu"
          dropout: 0.0
          output_activation: null
      critic:
        type: "attention"
        config:
          d_model: 32
          n_heads: 4
          n_layers: 1
          ff_hidden: 64
          head_hidden_sizes: [64]
          activation: "relu"
          dropout: 0.0
          output_activation: null
